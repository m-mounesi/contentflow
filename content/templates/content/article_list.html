<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ContentFlow | Articles</title>
</head>
<body>
    <h1>Articles</h1>

    {% for article in articles %}
        <article>
            <a href="{% url 'content:article_detail' slug=article.slug %}">
                <h2>{{ article.title }}</h2>
            </a>
            <p>{{ article.category.name }}</p>
            <p>{{ article.created_at|date:"Y-m-d" }}</p>
        </article>
    {% empty %}
        <p>No published articles yet.</p>
    {% endfor %}
</body>
</html>
