```html
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#F7F7F5">

    <title>{% block title %}ContentFlow — Ideas for curious developers{% endblock %}</title>

    <meta
        name="description"
        content="{% block meta_description %}Thoughtful notes on technology, software, and building things.{% endblock %}"
    >

    <link rel="stylesheet" href="{% static 'content/css/style.css' %}">
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
        <div class="container header-inner">

            <a
                class="wordmark"
                href="{% url 'content:article_list' %}"
                aria-label="ContentFlow home"
            >
                <span class="wordmark-mark" aria-hidden="true">C</span>
                <span>ContentFlow<span class="wordmark-period">.</span></span>
            </a>

            <nav class="site-nav" aria-label="Main navigation">
                <a href="{% url 'content:article_list' %}">Articles</a>
                <a href="#site-footer">About</a>
            </nav>

        </div>
    </header>

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer" id="site-footer">
        <div class="container footer-inner">

            <a
                class="footer-wordmark"
                href="{% url 'content:article_list' %}"
            >
                ContentFlow<span>.</span>
            </a>

            <p>Ideas, carefully written. Built for curious minds.</p>

            <span class="footer-note">
                © {% now "Y" %} ContentFlow
            </span>

        </div>
    </footer>
</body>
</html>
```
