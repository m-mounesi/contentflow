<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ article.title }} | ContentFlow</title>
</head>
<body>
    <article>
        <h1>{{ article.title }}</h1>

        <p>
            Category: {{ article.category.name }}
        </p>

        <p>
            Published: {{ article.published_at|date:"Y-m-d H:i" }}
        </p>

        <p>
            Last updated: {{ article.updated_at|date:"Y-m-d H:i" }}
        </p>

        <div>
            {{ article.body|linebreaks }}
        </div>
    </article>

    <a href="{% url 'content:article_list' %}">
        Back to articles
    </a>
</body>
</html>
